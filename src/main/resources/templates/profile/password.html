<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
  <title>Change password</title>
</head>
<body>
<div layout:fragment="content">

  <div class="mb-4">
    <p class="eyebrow">MY PROFILE</p>
    <h1 class="page-title">Change password</h1>
    <p class="page-sub">Any other session of your account ends when you do.</p>
  </div>

  <section class="hb-card hb-card-body" style="max-width: 32rem">
    <th:block th:replace="~{profile/password-form :: form}"></th:block>
  </section>

</div>
</body>
</html>

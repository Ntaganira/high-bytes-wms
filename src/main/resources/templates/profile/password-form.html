<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>

<!-- The change-password form, shared by the page in the layout and the
     stand-alone page a user sees when they must change it first. The
     passwords typed are never sent back: every field starts empty. -->
<th:block th:fragment="form">
  <div th:if="${problems}" class="alert alert-danger py-2 small" role="alert">
    <p th:each="p : ${problems}" th:text="${p}" class="mb-0">Use at least 10 characters.</p>
  </div>

  <form th:action="@{/profile/password}" method="post" autocomplete="off">
    <div class="mb-3">
      <label for="currentPassword" class="form-label small fw-semibold" style="color: var(--color-heading)">Current password</label>
      <input type="password" id="currentPassword" name="currentPassword" class="form-control"
             autocomplete="current-password" required>
      <div class="form-text">The temporary one, if you were just given one.</div>
    </div>
    <div class="mb-3">
      <label for="newPassword" class="form-label small fw-semibold" style="color: var(--color-heading)">New password</label>
      <input type="password" id="newPassword" name="newPassword" class="form-control"
             autocomplete="new-password" required th:attr="minlength=${minLength},maxlength=${maxLength}">
      <div class="form-text">
        At least <span th:text="${minLength}">10</span> characters. Length matters more than symbols:
        a short sentence you can remember works well. Not your username, nor a word anyone would guess here.
      </div>
    </div>
    <div class="mb-4">
      <label for="confirmPassword" class="form-label small fw-semibold" style="color: var(--color-heading)">New password again</label>
      <input type="password" id="confirmPassword" name="confirmPassword" class="form-control"
             autocomplete="new-password" required>
    </div>
    <button type="submit" class="btn btn-primary-action">
      <i class="bi bi-check-lg"></i> Change password
    </button>
  </form>
</th:block>

</body>
</html>

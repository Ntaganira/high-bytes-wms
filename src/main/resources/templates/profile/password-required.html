<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose your password · HIGH BYTES WMS</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- A user holding a temporary password sees only this page until they
     replace it: the password an administrator knows is not theirs to keep. -->
<div class="login-shell">
  <div class="login-card" style="max-width: 440px">

    <div class="login-brand">
      <div class="brand-logo" aria-hidden="true">HB</div>
      <div>
        <div style="color: var(--color-heading); font-weight: 800; letter-spacing: .3px">HIGH BYTES</div>
        <div style="color: var(--color-success); font-size: .66rem; font-weight: 700; letter-spacing: .8px">WAREHOUSE CONTROL</div>
      </div>
    </div>

    <h1 class="login-title">Choose your own password</h1>
    <p class="login-sub">
      You signed in with a password someone else issued. Replace it before anything else: every
      action you take is recorded against this account, so only you should know its password.
    </p>

    <th:block th:replace="~{profile/password-form :: form}"></th:block>

    <form th:action="@{/logout}" method="post" class="mt-3">
      <button type="submit" class="btn btn-link p-0 small">Sign out instead</button>
    </form>

  </div>
</div>

</body>
</html>

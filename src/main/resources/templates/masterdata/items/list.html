<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">
<head>
  <title>Item Master</title>
</head>
<body>
<div layout:fragment="content">

  <div class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-4">
    <div>
      <p class="eyebrow">MASTER DATA</p>
      <h1 class="page-title">Item Master</h1>
      <p class="page-sub">Shared across every branch. Stock balances are per branch.</p>
    </div>
    <a th:href="@{/items/new}" class="btn btn-primary-action" sec:authorize="hasAuthority('item.manage')">
      <i class="bi bi-plus-lg"></i> New item
    </a>
  </div>

  <!-- Filters in one row above the table -->
  <form class="hb-card hb-card-body mb-3" method="get" th:action="@{/items}">
    <div class="row g-2 align-items-end">
      <div class="col-12 col-md-4">
        <label for="q" class="form-label small fw-semibold" style="color: var(--color-heading)">Search</label>
        <input id="q" name="q" type="search" class="form-control" th:value="${q}"
               placeholder="Item code or description">
      </div>
      <div class="col-6 col-md-3">
        <label for="type" class="form-label small fw-semibold" style="color: var(--color-heading)">Product type</label>
        <select id="type" name="type" class="form-select">
          <option value="">All types</option>
          <option th:each="t : ${productTypes}" th:value="${t}" th:text="${t.label()}"
                  th:selected="${type != null and type.name() == t.name()}">Glass</option>
        </select>
      </div>
      <div class="col-6 col-md-2 d-flex flex-column gap-1 pb-1">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="belowReorder" name="belowReorder"
                 value="true" th:checked="${belowReorder}">
          <label class="form-check-label small" for="belowReorder">Below reorder</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="includeInactive" name="includeInactive"
                 value="true" th:checked="${includeInactive}">
          <label class="form-check-label small" for="includeInactive">Show inactive</label>
        </div>
      </div>
      <div class="col-12 col-md-3 d-flex gap-2">
        <button type="submit" class="btn btn-primary flex-grow-1">
          <i class="bi bi-funnel"></i> Apply
        </button>
        <a th:href="@{/items}" class="btn btn-outline-secondary">Clear</a>
      </div>
    </div>
  </form>

  <section class="hb-card">
    <div class="table-responsive">
      <table class="table hb-table mb-0">
        <thead>
          <tr>
            <th scope="col">Item code</th>
            <th scope="col">Description</th>
            <th scope="col">Specification</th>
            <th scope="col">Unit</th>
            <th scope="col" class="num">On hand</th>
            <th scope="col" class="num">Reorder</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="i : ${items}" th:classappend="${!i.active()} ? 'opacity-75'">
            <td>
              <a class="doc-link" th:href="@{'/items/' + ${i.id()}}" th:text="${i.itemCode()}">GL-CF-6</a>
            </td>
            <td th:text="${i.description()}">Clear float 6mm</td>
            <td class="text-body-secondary" th:text="${i.specification()}">Clear · 6mm · 2140×3300</td>
            <td class="mono" th:text="${i.baseUomCode()}">SHEET</td>
            <td class="num">
              <span th:if="${i.belowReorder()}" class="stock-pill"
                    th:text="${#numbers.formatDecimal(i.totalOnHand(), 0, 'COMMA', 0, 'POINT')}">18</span>
              <span th:unless="${i.belowReorder()}"
                    th:text="${#numbers.formatDecimal(i.totalOnHand(), 0, 'COMMA', 0, 'POINT')}">240</span>
            </td>
            <td class="num text-body-secondary"
                th:text="${i.reorderLevel() != null} ? ${#numbers.formatDecimal(i.reorderLevel(), 0, 'COMMA', 0, 'POINT')} : '—'">60</td>
            <td>
              <span th:if="${i.active()}" th:replace="~{fragments/ui :: chip('ACTIVE')}"></span>
              <span th:unless="${i.active()}" th:replace="~{fragments/ui :: chip('LOCKED')}"></span>
            </td>
          </tr>
          <tr th:if="${#lists.isEmpty(items)}">
            <td colspan="7">
              <div th:replace="~{fragments/ui :: emptyState('bi-grid-3x3-gap', 'No items match', 'Clear the filters, or create the first item.')}"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

  <p class="text-body-secondary small mt-2" th:if="${!#lists.isEmpty(items)}">
    <span th:text="${#lists.size(items)}">4</span> items.
    Stock on hand is for <span th:text="${currentBranch?.name}">this branch</span> only.
  </p>

</div>
</body>
</html>

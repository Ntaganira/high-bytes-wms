<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">
<head>
  <title th:text="${supplier.code()}">Supplier</title>
</head>
<body>
<div layout:fragment="content">

  <div class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-4">
    <div>
      <p class="eyebrow">MASTER DATA · SUPPLIER</p>
      <h1 class="page-title mono" th:text="${supplier.code()}">SUP-1</h1>
      <p class="page-sub" th:text="${supplier.name()}">Supplier</p>
    </div>
    <div class="d-flex gap-2" sec:authorize="hasAuthority('partner.manage')">
      <a th:href="@{'/suppliers/' + ${supplier.id()} + '/edit'}" class="btn btn-outline-secondary">
        <i class="bi bi-pencil"></i> Edit
      </a>
      <form th:if="${supplier.active()}" th:action="@{'/suppliers/' + ${supplier.id()} + '/deactivate'}" method="post" class="m-0">
        <button type="submit" class="btn btn-outline-danger"><i class="bi bi-slash-circle"></i> Deactivate</button>
      </form>
      <form th:unless="${supplier.active()}" th:action="@{'/suppliers/' + ${supplier.id()} + '/reactivate'}" method="post" class="m-0">
        <button type="submit" class="btn btn-outline-success"><i class="bi bi-arrow-counterclockwise"></i> Reactivate</button>
      </form>
    </div>
  </div>

  <div class="row g-3">
    <div class="col-12 col-lg-8">
      <section class="hb-card hb-card-body">
        <div class="card-head">
          <div class="card-title-row">
            <i class="bi bi-shop" aria-hidden="true"></i>
            <h2 class="card-title">Details</h2>
          </div>
          <span th:replace="~{fragments/ui :: chip(${supplier.active()} ? 'ACTIVE' : 'INACTIVE')}"></span>
        </div>
        <dl class="row mb-0 small">
          <dt class="col-5 col-md-3 text-body-secondary fw-normal">TIN</dt>
          <dd class="col-7 col-md-3 mono" th:text="${supplier.tin()} ?: '—'">TIN</dd>
          <dt class="col-5 col-md-3 text-body-secondary fw-normal">Country</dt>
          <dd class="col-7 col-md-3 mono">
            <span th:text="${supplier.countryCode()}">RW</span>
            <span th:if="${supplier.foreign()}" class="text-body-secondary">(foreign)</span>
          </dd>
          <dt class="col-5 col-md-3 text-body-secondary fw-normal">Phone</dt>
          <dd class="col-7 col-md-3" th:text="${supplier.phone()} ?: '—'">—</dd>
          <dt class="col-5 col-md-3 text-body-secondary fw-normal">Email</dt>
          <dd class="col-7 col-md-3" th:text="${supplier.email()} ?: '—'">—</dd>
          <dt class="col-5 col-md-3 text-body-secondary fw-normal">Address</dt>
          <dd class="col-7 col-md-9" th:text="${supplier.address()} ?: '—'">—</dd>
        </dl>
      </section>
    </div>

    <div class="col-12 col-lg-4">
      <section class="hb-card hb-card-body">
        <div class="card-head">
          <div class="card-title-row">
            <i class="bi bi-box-seam" aria-hidden="true"></i>
            <h2 class="card-title">Receipts</h2>
          </div>
        </div>
        <div class="kpi-value mono" th:text="${supplier.receiptCount()}">0</div>
        <p class="text-body-secondary small mt-3 mb-0" th:if="${supplier.receiptCount() > 0}">
          <i class="bi bi-lock"></i>
          Receipts name this supplier, so it can be deactivated but never deleted.
        </p>
      </section>
    </div>

    <div class="col-12">
      <section class="hb-card hb-card-body">
        <div class="card-head">
          <div class="card-title-row">
            <i class="bi bi-clock-history" aria-hidden="true"></i>
            <div>
              <h2 class="card-title">Change history</h2>
              <p class="card-sub">Every change ever made to this record, newest first</p>
            </div>
          </div>
        </div>

        <th:block th:if="${#lists.isEmpty(history)}">
          <div th:replace="~{fragments/ui :: emptyState('bi-clock-history', 'No changes recorded', 'Edits to this supplier will be listed here.')}"></div>
        </th:block>

        <th:block th:each="entry : ${history}">
          <div th:replace="~{fragments/ui :: auditEntry(${entry})}"></div>
        </th:block>
      </section>
    </div>
  </div>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/main}">
<head>
  <title>Suppliers</title>
</head>
<body>
<div layout:fragment="content">

  <div class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-4">
    <div>
      <p class="eyebrow">MASTER DATA</p>
      <h1 class="page-title">Suppliers</h1>
      <p class="page-sub">Who the company buys from. A goods received note can name only a supplier listed here and still active.</p>
    </div>
    <a th:href="@{/suppliers/new}" class="btn btn-primary-action" sec:authorize="hasAuthority('partner.manage')">
      <i class="bi bi-plus-lg"></i> New supplier
    </a>
  </div>

  <form class="hb-card hb-card-body mb-3" method="get" th:action="@{/suppliers}">
    <div class="row g-2 align-items-end">
      <div class="col-12 col-md-5">
        <label for="q" class="form-label small fw-semibold" style="color: var(--color-heading)">Search</label>
        <input id="q" name="q" type="search" class="form-control" th:value="${q}" placeholder="Code, name or TIN">
      </div>
      <div class="col-6 col-md-3 pb-1">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="includeInactive" name="includeInactive"
                 value="true" th:checked="${includeInactive}">
          <label class="form-check-label small" for="includeInactive">Show inactive</label>
        </div>
      </div>
      <div class="col-12 col-md-4 d-flex gap-2">
        <button type="submit" class="btn btn-primary flex-grow-1"><i class="bi bi-funnel"></i> Apply</button>
        <a th:href="@{/suppliers}" class="btn btn-outline-secondary">Clear</a>
      </div>
    </div>
  </form>

  <section class="hb-card">
    <div class="table-responsive">
      <table class="table hb-table mb-0">
        <thead>
          <tr>
            <th scope="col">Code</th>
            <th scope="col">Name</th>
            <th scope="col">TIN</th>
            <th scope="col">Country</th>
            <th scope="col" class="num">Receipts</th>
            <th scope="col">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="s : ${suppliers}" th:classappend="${!s.active()} ? 'opacity-75'">
            <td><a class="doc-link" th:href="@{'/suppliers/' + ${s.id()}}" th:text="${s.code()}">SUP-1</a></td>
            <td th:text="${s.name()}">Supplier</td>
            <td class="mono" th:text="${s.tin()} ?: '—'">TIN</td>
            <td class="mono">
              <span th:text="${s.countryCode()}">RW</span>
              <span th:if="${s.foreign()}" class="small text-body-secondary">foreign</span>
            </td>
            <td class="num" th:text="${s.receiptCount()}">0</td>
            <td><span th:replace="~{fragments/ui :: chip(${s.active()} ? 'ACTIVE' : 'INACTIVE')}"></span></td>
          </tr>
          <tr th:if="${#lists.isEmpty(suppliers)}">
            <td colspan="6">
              <div th:replace="~{fragments/ui :: emptyState('bi-shop', 'No suppliers match', 'Clear the search, or add the first supplier.')}"></div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>

</div>
</body>
</html>

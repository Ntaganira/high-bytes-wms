<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
  <title th:text="${form.new} ? 'New supplier' : 'Edit supplier'">Supplier</title>
</head>
<body>
<div layout:fragment="content">

  <div class="mb-4">
    <p class="eyebrow">MASTER DATA · SUPPLIER</p>
    <h1 class="page-title" th:text="${form.new} ? 'New supplier' : 'Edit ' + (${storedCode} ?: ${form.code})">New supplier</h1>
  </div>

  <form th:action="${form.new} ? @{/suppliers} : @{'/suppliers/' + ${form.id}}"
        th:object="${form}" method="post" novalidate>

    <div class="row g-3">
      <div class="col-12 col-lg-8">
        <section class="hb-card hb-card-body">
          <div class="card-head">
            <div class="card-title-row">
              <i class="bi bi-shop" aria-hidden="true"></i>
              <h2 class="card-title">Supplier</h2>
            </div>
          </div>

          <div class="row g-3">
            <div class="col-12 col-md-4">
              <label for="code" class="form-label small fw-semibold" style="color: var(--color-heading)">
                Code <span class="text-danger">*</span>
              </label>
              <input id="code" th:field="*{code}" class="form-control mono"
                     th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'" autocomplete="off">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('code')}" th:errors="*{code}">error</div>
            </div>

            <div class="col-12 col-md-8">
              <label for="name" class="form-label small fw-semibold" style="color: var(--color-heading)">
                Name <span class="text-danger">*</span>
              </label>
              <input id="name" th:field="*{name}" class="form-control"
                     th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" autocomplete="off">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">error</div>
            </div>

            <div class="col-6 col-md-4">
              <label for="tin" class="form-label small fw-semibold" style="color: var(--color-heading)">TIN</label>
              <input id="tin" th:field="*{tin}" class="form-control mono"
                     th:classappend="${#fields.hasErrors('tin')} ? 'is-invalid'" autocomplete="off">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('tin')}" th:errors="*{tin}">error</div>
            </div>

            <div class="col-6 col-md-4">
              <label for="countryCode" class="form-label small fw-semibold" style="color: var(--color-heading)">
                Country <span class="text-danger">*</span>
              </label>
              <input id="countryCode" th:field="*{countryCode}" class="form-control mono" maxlength="2"
                     th:classappend="${#fields.hasErrors('countryCode')} ? 'is-invalid'" autocomplete="off">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('countryCode')}" th:errors="*{countryCode}">error</div>
              <div class="form-text">Anything other than RW is a foreign supplier.</div>
            </div>

            <div class="col-12 col-md-4">
              <label for="phone" class="form-label small fw-semibold" style="color: var(--color-heading)">Phone</label>
              <input id="phone" th:field="*{phone}" class="form-control"
                     th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" autocomplete="off">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">error</div>
            </div>

            <div class="col-12 col-md-6">
              <label for="email" class="form-label small fw-semibold" style="color: var(--color-heading)">Email</label>
              <input id="email" th:field="*{email}" class="form-control"
                     th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" autocomplete="off">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">error</div>
            </div>

            <div class="col-12 col-md-6">
              <label for="address" class="form-label small fw-semibold" style="color: var(--color-heading)">Address</label>
              <input id="address" th:field="*{address}" class="form-control"
                     th:classappend="${#fields.hasErrors('address')} ? 'is-invalid'" autocomplete="off">
              <div class="invalid-feedback" th:if="${#fields.hasErrors('address')}" th:errors="*{address}">error</div>
            </div>

            <div class="col-12">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="active" th:field="*{active}">
                <label class="form-check-label" for="active">
                  Active
                  <span class="text-body-secondary small d-block">
                    An inactive supplier cannot be named on a new receipt. It stays on every past one.
                  </span>
                </label>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>

    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-primary-action">
        <i class="bi bi-check-lg"></i>
        <span th:text="${form.new} ? 'Create supplier' : 'Save changes'">Create supplier</span>
      </button>
      <a th:href="${form.new} ? @{/suppliers} : @{'/suppliers/' + ${form.id}}" class="btn btn-outline-secondary">Cancel</a>
    </div>

  </form>

</div>
</body>
</html>

<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main}">
<head>
  <title th:text="${location.code()}">Location</title>
</head>
<body>
<div layout:fragment="content">

  <div class="d-flex flex-wrap align-items-start justify-content-between gap-3 mb-4">
    <div>
      <p class="eyebrow" th:text="'MASTER DATA · LOCATION · ' + ${#strings.toUpperCase(location.branchName())}">
        MASTER DATA · LOCATION</p>
      <h1 class="page-title mono" th:text="${location.code()}">KGL-MAIN</h1>
      <p class="page-sub" th:text="${location.name()}">Gahanga main store</p>
    </div>
    <!-- canManage: the right held at this location's own branch, not merely somewhere. -->
    <a th:href="@{'/locations/' + ${location.id()} + '/edit'}" class="btn btn-outline-secondary"
       th:if="${canManage}">
      <i class="bi bi-pencil"></i> Edit
    </a>
  </div>

  <div class="row g-3">

    <div class="col-12 col-lg-5">
      <section class="hb-card hb-card-body">
        <div class="card-head">
          <div class="card-title-row">
            <i class="bi bi-geo-alt" aria-hidden="true"></i>
            <h2 class="card-title">Details</h2>
          </div>
          <span th:replace="~{fragments/ui :: chip(${location.active()} ? 'ACTIVE' : 'INACTIVE')}"></span>
        </div>

        <dl class="row mb-0 small">
          <dt class="col-5 text-body-secondary fw-normal">Branch</dt>
          <dd class="col-7" th:text="${location.branchName()}">Gahanga</dd>
          <dt class="col-5 text-body-secondary fw-normal">Type</dt>
          <dd class="col-7" th:text="${location.locationType().label()}">Warehouse</dd>
          <dt class="col-5 text-body-secondary fw-normal">Bonded</dt>
          <dd class="col-7">
            <th:block th:if="${location.bonded()}"><span th:replace="~{fragments/ui :: chip('BONDED')}"></span></th:block>
            <span th:unless="${location.bonded()}" class="text-body-secondary">No</span>
          </dd>
          <dt class="col-5 text-body-secondary fw-normal">Holds saleable stock</dt>
          <dd class="col-7" th:text="${location.sellable()} ? 'Yes' : 'No'">Yes</dd>
          <dt class="col-5 text-body-secondary fw-normal">Distinct items</dt>
          <dd class="col-7 mono" th:text="${location.distinctItems()}">12</dd>
        </dl>
      </section>
    </div>

    <div class="col-12 col-lg-7">
      <section class="hb-card hb-card-body">
        <div class="card-head">
          <div class="card-title-row">
            <i class="bi bi-grid-3x3" aria-hidden="true"></i>
            <div>
              <h2 class="card-title">Bins</h2>
              <p class="card-sub">Where inside this location a thing sits</p>
            </div>
          </div>
        </div>

        <form class="row g-2 align-items-end mb-3" method="post"
              th:action="@{'/locations/' + ${location.id()} + '/bins'}"
              th:if="${canManage}">
          <div class="col-5 col-md-4">
            <label for="binCode" class="form-label small fw-semibold" style="color: var(--color-heading)">Bin code</label>
            <input id="binCode" name="binCode" class="form-control mono" required maxlength="24"
                   placeholder="A1-02" autocomplete="off">
          </div>
          <div class="col-4 col-md-5">
            <label for="zone" class="form-label small fw-semibold" style="color: var(--color-heading)">Zone</label>
            <input id="zone" name="zone" class="form-control" maxlength="40" placeholder="Rack A">
          </div>
          <div class="col-3">
            <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg"></i> Add</button>
          </div>
        </form>

        <div class="table-responsive">
          <table class="table hb-table mb-0">
            <thead>
              <tr>
                <th scope="col">Bin</th><th scope="col">Zone</th>
                <th scope="col" class="num">Items</th><th scope="col">Status</th>
                <th scope="col" th:if="${canManage}"></th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="b : ${bins}">
                <td class="mono" th:text="${b.binCode()}">A1-02</td>
                <td class="text-body-secondary" th:text="${b.zone()} ?: '—'">Rack A</td>
                <td class="num mono" th:text="${b.distinctItems()}">3</td>
                <td>
                  <span th:replace="~{fragments/ui :: chip(${b.active()} ? 'ACTIVE' : 'INACTIVE')}"></span>
                </td>
                <td th:if="${canManage}">
                  <form method="post" class="m-0"
                        th:action="@{'/locations/' + ${location.id()} + '/bins/' + ${b.id()} + '/toggle'}">
                    <input type="hidden" name="active" th:value="${!b.active()}">
                    <button type="submit" class="btn btn-sm btn-link p-0"
                            th:text="${b.active()} ? 'Deactivate' : 'Reactivate'"
                            th:disabled="${b.active() and b.holdsStock()}"
                            th:title="${b.active() and b.holdsStock()} ? 'This bin still holds stock' : null">
                      Deactivate
                    </button>
                  </form>
                </td>
              </tr>
              <tr th:if="${#lists.isEmpty(bins)}">
                <td th:colspan="${canManage} ? 5 : 4">
                  <div th:replace="~{fragments/ui :: emptyState('bi-grid-3x3', 'No bins yet', 'Stock can sit at the location itself, or in a bin for precision.')}"></div>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>

    <div class="col-12">
      <section class="hb-card hb-card-body">
        <div class="card-head">
          <div class="card-title-row">
            <i class="bi bi-clock-history" aria-hidden="true"></i>
            <h2 class="card-title">Change history</h2>
          </div>
        </div>
        <th:block th:if="${#lists.isEmpty(history)}">
          <div th:replace="~{fragments/ui :: emptyState('bi-clock-history', 'No changes recorded', 'Edits to this location will be listed here.')}"></div>
        </th:block>
        <th:block th:each="entry : ${history}">
          <div th:replace="~{fragments/ui :: auditEntry(${entry})}"></div>
        </th:block>
      </section>
    </div>

  </div>

</div>
</body>
</html>

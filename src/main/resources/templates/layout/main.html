<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title layout:title-pattern="$CONTENT_TITLE · HIGH BYTES WMS">HIGH BYTES WMS</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">

  <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}">
  <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/font/bootstrap-icons.min.css}">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">

  <!-- tokens first: every component style below reads from it -->
  <link rel="stylesheet" th:href="@{/css/tokens.css}">
  <link rel="stylesheet" th:href="@{/css/app.css}">

  <!-- Before first paint, or a folded sidebar opens and shuts again on every
       page. app.js owns the toggle; this only reads the remembered choice. -->
  <script>
    try {
      if (localStorage.getItem('hb.sidebar') === 'collapsed') {
        document.documentElement.classList.add('sidebar-collapsed');
      }
    } catch (e) { /* storage blocked: the sidebar opens, as it always did */ }
  </script>

  <!-- CSRF for htmx: every mutating request carries the token -->
  <meta name="_csrf" th:content="${_csrf?.token}">
  <meta name="_csrf_header" th:content="${_csrf?.headerName}">

  <th:block layout:fragment="head"></th:block>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar}"></div>
<button th:replace="~{fragments/sidebar :: toggle}"></button>

<div class="app-main">

  <div th:replace="~{fragments/topbar :: topbar}"></div>

  <main class="content">

    <!-- Flash messages. A refused posting explains itself here. -->
    <div th:if="${flashError}" class="alert alert-danger d-flex align-items-start gap-2" role="alert">
      <i class="bi bi-exclamation-octagon-fill"></i>
      <span th:text="${flashError}">Error</span>
    </div>
    <div th:if="${flashSuccess}" class="alert alert-success d-flex align-items-start gap-2" role="alert">
      <i class="bi bi-check-circle-fill"></i>
      <span th:text="${flashSuccess}">Done</span>
    </div>
    <div th:if="${flashWarning}" class="alert alert-warning d-flex align-items-start gap-2" role="alert">
      <i class="bi bi-exclamation-triangle-fill"></i>
      <span th:text="${flashWarning}">Done, but note</span>
    </div>

    <th:block layout:fragment="content"></th:block>
  </main>
</div>

<script th:src="@{/webjars/bootstrap/js/bootstrap.bundle.min.js}"></script>
<script th:src="@{/webjars/htmx.org/dist/htmx.min.js}"></script>
<script th:src="@{/js/app.js}"></script>
<th:block layout:fragment="scripts"></th:block>

</body>
</html>
